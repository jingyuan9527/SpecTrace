# ============================================================
# 前后端一体化模式 · 源码构建覆盖文件
#
# 用法（需同时叠加主编排与一体化覆盖）：
#   docker compose -f docker-compose.yml -f docker-compose.allinone.yml -f docker-compose.allinone.build.yml up -d --build
#
# 构建上下文为【仓库根目录】，使用 Dockerfile.allinone 生成单镜像。
# ============================================================
name: spectrace

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.allinone
