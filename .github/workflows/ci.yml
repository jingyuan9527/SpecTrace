name: CI

# PR 与主干推送都要过一遍：类型、构建、后端编译与单测、e2e。
# 接口由 e2e/mock-api.ts 拦截，不需要数据库与外部服务。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端类型检查 / 构建 / e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 生产构建
        run: npm run build

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: e2e
        run: npm run test:e2e

      - name: 失败时保留 trace / 截图 / 视频
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  backend:
    name: 后端编译与单测
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 打包（含单测）
        run: mvn -B package
