# ============================================================
# SpecTrace 源码构建覆盖文件：为主编排的 app 服务补充 build 配置
#
# 用法（同目录下叠加）：
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# 构建上下文为【仓库根目录】，使用根目录 Dockerfile（前后端一体单镜像）。
# 镜像名与标签仍由 docker-compose.yml 中的 image 决定。
# ============================================================
name: spectrace

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
