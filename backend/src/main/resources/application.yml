server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: spectrace-backend
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      continue-on-error: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---- 业务自定义配置 ----
spectrace:
  jwt:
    secret: "spectrace-dev-secret-key-please-change-in-production-0123456789"
    expire-seconds: 86400
  agent:
    # AgentScope 回传数据时需携带的内部令牌，避免回调接口被外部滥用
    callback-token: "spectrace-agent-callback-token"
    # 队列实现：memory(本地开发) / redis(生产)
    queue: memory
    queue-key: "spectrace:agent:task"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.spectrace: debug

---
# 本地开发：H2 内存库，无需安装 MySQL / Redis
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:spectrace;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

---
# 生产/联调：MySQL + Redis
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/spectrace?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  sql:
    init:
      mode: never
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

spectrace:
  agent:
    queue: redis
