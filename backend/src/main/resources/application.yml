server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: spectrace-backend
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  datasource:
    url: jdbc:sqlite:${SPECTRACE_DB_PATH:./data/spectrace.db}?journal_mode=WAL&busy_timeout=10000&synchronous=NORMAL&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite WAL 同一时刻只允许一个写者：池越大并发写连接越多，busy_timeout 排队与
      # SQLITE_BUSY 概率反而越高；收敛到 4 足够 Web + Agent 抓取并发，读不受影响
      maximum-pool-size: 4
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      continue-on-error: false
  servlet:
    multipart:
      # 前端会先做压缩，这里留足余量并作为最终兜底
      max-file-size: 10MB
      max-request-size: 12MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---- 业务自定义配置 ----
# 健康检查与指标：容器探针用 /actuator/health，监控抓取用 /actuator/metrics（需登录）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  # 默认不使用 Redis 队列，关闭其健康检查，避免 /actuator/health 恒为 DOWN；
  # 改用 SPECTRACE_AGENT_QUEUE=redis 时请把该项设为 true
  health:
    redis:
      enabled: ${SPECTRACE_REDIS_HEALTH_ENABLED:false}

spectrace:
  jwt:
    # 必须通过环境变量提供（见 .env.example）；缺省为空，JwtUtil 启动时校验并拒绝启动
    secret: ${SPECTRACE_JWT_SECRET:}
    expire-seconds: ${SPECTRACE_JWT_EXPIRE_SECONDS:86400}
  # 跨域白名单（逗号分隔，如 https://a.com,https://b.com）；未配置保持任意来源，公网部署务必收敛
  cors:
    origins: ${SPECTRACE_CORS_ORIGINS:}
  # 公开接口基础限流：单 IP 每分钟请求数上限（feedback / insight 有各自更严格的限流，叠加生效）
  public:
    rate-limit-qpm: ${SPECTRACE_PUBLIC_QPM:120}
  # 站点对外域名（含协议，如 https://spectrace.example.com），用于 sitemap / robots；
  # 反向代理部署时务必配置，否则会回退到请求域名（可能拿到内网地址）
  public-base-url: ${SPECTRACE_PUBLIC_BASE_URL:}
  # 对比页 AI 差异摘要：按需生成并缓存，未配置可用模型时前端自动隐藏入口
  ai:
    insight:
      enabled: ${SPECTRACE_AI_INSIGHT_ENABLED:true}
      cache-hours: ${SPECTRACE_AI_INSIGHT_CACHE_HOURS:24}
      # 全站每日真实模型调用上限（对比摘要/世代回顾/社媒文案共享），0 不限制；缓存命中不计数
      daily-quota: ${SPECTRACE_AI_INSIGHT_DAILY_QUOTA:100}
    # AI 绘图（社媒海报）：仅后台内部使用，不对访客开放；供应商与提示词在后台维护
    image:
      enabled: ${SPECTRACE_AI_IMAGE_ENABLED:true}
      # 单个管理员每分钟生成次数上限：绘图成本高于文案，默认比 AI 摘要更严
      rate-limit-per-minute: ${SPECTRACE_AI_IMAGE_QPM:3}
      timeout-seconds: ${SPECTRACE_AI_IMAGE_TIMEOUT_SECONDS:120}
  # SQLite 每日备份：VACUUM INTO 生成快照并只保留最近 N 份
  backup:
    enabled: ${SPECTRACE_BACKUP_ENABLED:true}
    dir: ${SPECTRACE_BACKUP_DIR:./data/backups}
    keep: ${SPECTRACE_BACKUP_KEEP:7}
    cron: ${SPECTRACE_BACKUP_CRON:0 30 3 * * *}
  # 图片上传落盘目录与大小上限（前端已压缩，此值仅做服务端兜底）
  upload-dir: ${SPECTRACE_UPLOAD_DIR:uploads}
  upload:
    max-bytes: ${SPECTRACE_UPLOAD_MAX_BYTES:8388608}
  # 增长数据保留策略：终态任务/已处理待审核/操作日志 定时清理，防止 SQLite 无界膨胀
  retention:
    enabled: ${SPECTRACE_RETENTION_ENABLED:true}
    cron: ${SPECTRACE_RETENTION_CRON:0 0 4 * * *}
    task-days: ${SPECTRACE_RETENTION_TASK_DAYS:30}
    pending-days: ${SPECTRACE_RETENTION_PENDING_DAYS:30}
    operation-log-days: ${SPECTRACE_RETENTION_OPERATION_LOG_DAYS:90}
    # 机型浏览量按天聚合的保留天数
    view-daily-days: ${SPECTRACE_RETENTION_VIEW_DAILY_DAYS:90}
    # 访客搜索词聚合的保留天数
    search-log-days: ${SPECTRACE_RETENTION_SEARCH_LOG_DAYS:90}
    # 模型调用明细保留天数（每轮 Agent 调用一条，默认比任务日志更短）
    ai-call-days: ${SPECTRACE_RETENTION_AI_CALL_DAYS:30}
    # MCP 工具调用日志保留天数
    mcp-call-days: ${SPECTRACE_RETENTION_MCP_CALL_DAYS:30}
  # 运行告警（T104）：待审核积压 / 备份失败 / 磁盘水位；webhook 复用 AGENT_ALERT_WEBHOOK，阈值 0 关闭对应规则
  alert:
    cron: ${SPECTRACE_ALERT_CRON:0 0 * * * *}
    pending-count: ${SPECTRACE_ALERT_PENDING_COUNT:20}
    pending-oldest-hours: ${SPECTRACE_ALERT_PENDING_OLDEST_HOURS:48}
    disk-free-mb: ${SPECTRACE_ALERT_DISK_FREE_MB:1024}
  # 系列订阅抓取调度（T88）：每天检查到期订阅并自动创建「系列发现」任务
  subscription:
    cron: ${SPECTRACE_SUBSCRIPTION_CRON:0 0 5 * * *}
  # ---- 内嵌采集 Agent（AgentScope Java 2.0 · Harness 模式，与后端同进程）----
  agent:
    # 是否随应用启动常驻消费抓取任务
    enabled: ${SPECTRACE_AGENT_ENABLED:true}
    # 队列实现：memory(默认，无需外部服务) / redis(可选，多实例部署)
    queue: ${SPECTRACE_AGENT_QUEUE:memory}
    queue-key: "spectrace:agent:task"
    # HarnessAgent 工作区（persona/AGENTS.md 及运行期会话数据的落盘位置）
    workspace: ${AGENTSCOPE_WORKSPACE:.agentscope/workspace}
    # 阻塞等待任务的超时（秒）
    poll-interval-seconds: ${POLL_INTERVAL_SECONDS:5}
    # 采集消费线程数；SQLite 为单写者，2 线程并行收益最高，再大只加剧写锁竞争
    worker-concurrency: ${AGENT_WORKER_CONCURRENCY:2}
    # 大模型：正常由后台「AI 配置」下发，此处仅作兜底
    dashscope-api-key: ${DASHSCOPE_API_KEY:}
    dashscope-model: ${DASHSCOPE_MODEL:qwen-max}
    # 搜索：留空使用 DuckDuckGo 免 key 抓取，填入则使用 Serper
    serper-api-key: ${SERPER_API_KEY:}
    search-result-limit: ${SEARCH_RESULT_LIMIT:5}
    # 抓取风控：每次请求间隔（秒）；单任务最长耗时与单次模型请求超时
    crawl-interval-seconds: ${CRAWL_INTERVAL_SECONDS:2}
    task-timeout-seconds: ${TASK_TIMEOUT_SECONDS:420}
    model-timeout-seconds: ${MODEL_TIMEOUT_SECONDS:45}
    # 连续失败告警：达到次数写 ERROR 日志（关键字 AGENT_CONSECUTIVE_FAILURE），webhook 可选
    alert-threshold: ${AGENT_ALERT_THRESHOLD:3}
    alert-webhook: ${AGENT_ALERT_WEBHOOK:}
  # ---- 对外 MCP 服务（Streamable HTTP，供 Claude Desktop / Cursor 等 Agent 客户端接入）----
  mcp:
    enabled: ${SPECTRACE_MCP_ENABLED:true}
    # 端点路径，与 server.servlet.context-path 无关，需带前导斜杠
    endpoint: ${SPECTRACE_MCP_ENDPOINT:/mcp}
    server-name: ${SPECTRACE_MCP_SERVER_NAME:spectrace}
    server-version: ${SPECTRACE_MCP_SERVER_VERSION:1.0.0}
    # 单页返回上限：Agent 一次拉太多行既浪费上下文也拖慢 SQLite
    max-page-size: ${SPECTRACE_MCP_MAX_PAGE_SIZE:100}
    # 调用日志里 arguments 的截断长度，避免大 params 把日志表撑爆
    log-arguments-max-length: ${SPECTRACE_MCP_LOG_ARG_MAX_LENGTH:2000}
    # 首次启动自动创建的 Agent（配置了 api-key 才创建，留空则只能由后台接口创建）
    bootstrap:
      agent-name: ${SPECTRACE_MCP_BOOTSTRAP_AGENT:}
      api-key: ${SPECTRACE_MCP_BOOTSTRAP_KEY:}
      role: ${SPECTRACE_MCP_BOOTSTRAP_ROLE:EDITOR}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    # info 起步：mapper 的 SQL DEBUG 日志不再输出，需要排查 SQL 时临时调 debug
    com.spectrace: info
    io.agentscope: warn
