server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: spectrace-backend
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      continue-on-error: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---- 业务自定义配置 ----
spectrace:
  jwt:
    secret: "spectrace-dev-secret-key-please-change-in-production-0123456789"
    expire-seconds: 86400
  # ---- 内嵌采集 Agent（AgentScope Java 2.0 · Harness 模式，与后端同进程）----
  agent:
    # 是否随应用启动常驻消费抓取任务
    enabled: ${SPECTRACE_AGENT_ENABLED:true}
    # 队列实现：memory(本地开发) / redis(生产)
    queue: memory
    queue-key: "spectrace:agent:task"
    # HarnessAgent 工作区（persona/AGENTS.md 及运行期会话数据的落盘位置）
    workspace: ${AGENTSCOPE_WORKSPACE:.agentscope/workspace}
    # 阻塞等待任务的超时（秒）
    poll-interval-seconds: ${POLL_INTERVAL_SECONDS:5}
    # 大模型：正常由后台「AI 配置」下发，此处仅作兜底
    dashscope-api-key: ${DASHSCOPE_API_KEY:}
    dashscope-model: ${DASHSCOPE_MODEL:qwen-max}
    # 搜索：留空使用 DuckDuckGo 免 key 抓取，填入则使用 Serper
    serper-api-key: ${SERPER_API_KEY:}
    search-result-limit: ${SEARCH_RESULT_LIMIT:5}
    # 抓取风控：每次请求间隔（秒）与单任务最长耗时
    crawl-interval-seconds: ${CRAWL_INTERVAL_SECONDS:2}
    task-timeout-seconds: ${TASK_TIMEOUT_SECONDS:180}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.spectrace: debug
    io.agentscope: warn

---
# 本地开发：H2 内存库，无需安装 MySQL / Redis
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:spectrace;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

---
# 生产/联调：MySQL + Redis
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/spectrace?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  sql:
    init:
      mode: never
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

spectrace:
  agent:
    queue: redis
