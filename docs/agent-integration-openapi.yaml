openapi: 3.0.3
info:
  title: SpecTrace 手机参数对比平台 - AgentScope 交互接口
  version: 1.0.0
  description: |
    SpringBoot 业务后端 与 AgentScope 采集 Agent 之间的契约。

    两种消费方式，二选一：
    1. **Redis 队列（生产）**：SpringBoot 将任务写入 Redis List，
       AgentScope 使用 `BLPOP` 消费；随后通过本接口 `callback` 回传结果。
    2. **HTTP 轮询（本地/降级）**：AgentScope 定时调用 `GET /api/agent/tasks/pull` 拉取任务。

    所有接口均需在请求头携带 `X-Agent-Token`，值等于
    SpringBoot 配置项 `spectrace.agent.callback-token`。

    **职责隔离**：AgentScope 不持有任何数据库连接，只负责采集与回调，
    所有入库、审核状态流转均由 SpringBoot 掌管。
servers:
  - url: http://localhost:8080
    description: 本地开发环境
tags:
  - name: Agent Tasks
    description: 任务拉取与状态推进
  - name: Agent Callback
    description: 抓取结果回传
  - name: Agent Schema
    description: 参数抽取 Schema
security:
  - AgentToken: []
paths:
  /api/agent/tasks/pull:
    get:
      tags: [Agent Tasks]
      summary: 拉取下一个待抓取任务
      description: 无任务时返回 204，有任务时返回任务载荷并将任务置为 RUNNING。
      operationId: pullTask
      responses:
        '200':
          description: 返回任务
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentTaskPayload'
        '204':
          description: 当前无任务
        '401':
          description: X-Agent-Token 非法

  /api/agent/tasks/{id}/running:
    post:
      tags: [Agent Tasks]
      summary: 标记任务为抓取中
      description: AgentScope 直接从 Redis 队列消费任务时调用，用于后台展示抓取进度。
      operationId: markRunning
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/agent/callback:
    post:
      tags: [Agent Callback]
      summary: 回传抓取结果
      description: |
        抓取成功后，SpringBoot 将数据写入【待审核数据表】并把任务状态置为 PENDING_REVIEW；
        失败时置为 FAILED。数据不会直接进入正式机型库，必须经管理员审核。
      operationId: callback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCallbackRequest'
            examples:
              success:
                summary: 抓取成功
                value:
                  taskId: 12
                  modelName: iPhone 17
                  brandName: Apple
                  sourceUrl: https://www.apple.com.cn/iphone-17/specs/
                  status: SUCCESS
                  durationMs: 42150
                  params:
                    screen_size: "6.3"
                    chipset: Apple A19
                    battery_capacity: "3600"
                    release_date: "2025-09-19"
                  logs: "search:2 pages, fetch:3, extract:ok"
              failed:
                summary: 抓取失败
                value:
                  taskId: 12
                  modelName: iPhone 17
                  status: FAILED
                  durationMs: 8000
                  error: "所有来源均抓取超时"
      responses:
        '200':
          description: 已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/agent/schema:
    get:
      tags: [Agent Schema]
      summary: 获取参数抽取 Schema
      description: |
        返回所有启用的参数定义（paramKey / 名称 / 分组 / 类型 / 单位 / 枚举），
        AgentScope 据此构建 LLM 结构化抽取的 JSON Schema，并做输出校验。
      operationId: getSchema
      responses:
        '200':
          description: 参数定义列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ParamDef'

  /api/agent/ai-config:
    get:
      tags: [Agent Schema]
      summary: 获取 AI 模型调用参数
      description: |
        返回实际可用的模型调用参数（provider / baseUrl / apiKey / model / temperature）。
        传入 modelId 则返回该任务指定的模型；不传则返回后台标记为默认的模型。
        后台「AI 配置」修改后下一轮任务即生效，无需重启 Agent。
      operationId: getAiConfig
      parameters:
        - name: modelId
          in: query
          required: false
          description: 指定使用的模型（ai_model.id），缺省用默认模型
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 模型调用参数
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ResolvedModel'

components:
  securitySchemes:
    AgentToken:
      type: apiKey
      in: header
      name: X-Agent-Token
      description: 内部调用令牌，等于 spectrace.agent.callback-token

  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          nullable: true

    AgentTaskPayload:
      type: object
      properties:
        taskId:
          type: integer
          format: int64
        modelName:
          type: string
          example: iPhone 17
        brandName:
          type: string
          nullable: true
          example: Apple
        aiModelId:
          type: integer
          format: int64
          nullable: true
          description: 该任务指定使用的模型（ai_model.id），为空则由 Agent 用默认模型

    AgentCallbackRequest:
      type: object
      required: [taskId, modelName, status]
      properties:
        taskId:
          type: integer
          format: int64
        modelName:
          type: string
        brandName:
          type: string
          nullable: true
        sourceUrl:
          type: string
          nullable: true
        status:
          type: string
          enum: [SUCCESS, FAILED]
        durationMs:
          type: integer
          format: int64
        error:
          type: string
          nullable: true
        params:
          type: object
          additionalProperties: true
          description: paramKey -> value，键必须与 /api/agent/schema 返回的 paramKey 一致
        logs:
          type: string
          nullable: true

    ParamDef:
      type: object
      properties:
        id:
          type: integer
          format: int64
        paramKey:
          type: string
          example: screen_size
        paramName:
          type: string
          example: 屏幕尺寸
        groupId:
          type: integer
          format: int64
        paramType:
          type: string
          enum: [text, number, image, date, select]
        enumOptions:
          type: string
          nullable: true
        unit:
          type: string
          nullable: true
          example: 英寸
        sortOrder:
          type: integer
        enabled:
          type: integer
          example: 1

    ResolvedModel:
      type: object
      description: Agent 实际调用大模型所需参数（含 API Key，仅经内部令牌接口下发）
      properties:
        modelId:
          type: integer
          format: int64
          example: 1
        provider:
          type: string
          description: dashscope / openai / deepseek / moonshot / ollama ...
          example: dashscope
        baseUrl:
          type: string
          nullable: true
          example: https://dashscope.aliyuncs.com/compatible-mode/v1
        model:
          type: string
          example: qwen-max
        apiKey:
          type: string
          nullable: true
        temperature:
          type: number
          format: double
          example: 0.2

